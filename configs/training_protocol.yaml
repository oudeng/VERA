schema_version: 1

_comment: |-
  P2c decision (option d): the R1 training protocol for the neural methods.

  ============================================================================
  ONE RULE: run the budget the code already configures. Do not stop early.
  ============================================================================

  The rule is deliberately not "pick a good N". N is 200 because that is what
  `SNIConfig.epochs` and `TabCSDIBaseline.epochs` were already set to, long
  before anyone knew about B76. A number fixed before the problem was
  discovered cannot be a number tuned after it, which is the whole point of
  choosing this over a scan-and-select procedure.

  What was wrong (B76). Both SNI (`sni/imputer.py:129-132, 827, 946`) and
  TabCSDI (`baselines/TabCSDI_v1.py:417, 436-495`) early-stop on the **training**
  loss with `patience=20` and `min_epochs=50`, and both bind
  `CosineAnnealingLR(T_max=epochs)` to the same `epochs` value. Two consequences:

    * the stopping signal is computed on randomly-masked positions per batch, so
      it is noisy, and 20 consecutive non-improvements happen readily;
    * raising `epochs` slows the LR decay, which makes the loss noisier, which
      makes the rule fire *sooner*. Measured on NHANES: cap 200 -> 136 epochs,
      cap 800 -> **52** epochs. Four times the budget, 38 % of the training.

  Measured effect of running the configured budget (16 probe runs,
  `results/T2b_tabcsdi_budget/epoch_probe.csv`):

    default early stopping   8 runs   52-136 epochs   R2 positive in 0/8
    forced 200 epochs        4 runs   201 epochs      R2 positive in 2/4
    forced 800 epochs        4 runs   801 epochs      R2 positive in 4/4

  Scope. Only SNI and TabCSDI have such a rule. GAIN runs a fixed
  `iterations=10000` loop with no early stopping (its two `break`s are a NaN
  guard that never fired in any smoke run), and MIWAE's training loop is
  explicitly annotated "no early stopping, fixed epochs". So this changes two of
  the four neural methods, and finding B73 -- that GAIN is genuinely weak rather
  than under-trained -- stands.

# ---------------------------------------------------------------------------
protocol:
  name: p2c_option_d
  disable_early_stopping: true
  epochs:
    _doc: |-
      Not a new setting. These are the values already present in the code, kept
      verbatim so that the change is "the budget was executed", not "the budget
      was raised".
    SNI: 200          # sni/imputer.py:129
    TabCSDI: 200      # baselines/registry.py:699
  unchanged:
    _doc: Everything else stays exactly as R0 had it.
    items:
      - learning rate, batch size, hidden dims, heads, embedding dim
      - diffusion steps, number of samples
      - lambda parameterization, CPFA structure, D aggregation, prior formula
      - GAIN (iterations=10000) and MIWAE (epochs=500) are untouched

affected_methods:
  SNI:
    has_early_stopping: true
    signal: training loss on randomly-masked positions
    patience: 20
    min_epochs: 50
    lr_schedule_bound_to_epochs: true
    action: disable early stopping, train the configured 200 epochs
  TabCSDI:
    has_early_stopping: true
    signal: training loss on randomly-masked positions
    patience: 20
    min_epochs: 50
    lr_schedule_bound_to_epochs: true
    action: disable early stopping, train the configured 200 epochs
  GAIN:
    has_early_stopping: false
    signal: null
    note: >-
      Fixed `iterations=10000`. The two `break` statements in GAIN_v5.py:524,558
      are a NaN guard (`nan_count > 100`) and fired zero times across all smoke
      runs. Not affected.
    action: none
  MIWAE:
    has_early_stopping: false
    signal: null
    note: >-
      MIWAE_v3.py:446 annotates the loop "no early stopping, fixed epochs";
      epochs=500, min_epochs=200. Not affected.
    action: none

reporting:
  _doc: How each side is described, per P2c sections 1.2 and 1.3.
  tabcsdi: >-
    A documentation correction plus a harness fix. The ESM recorded 100 epochs
    (B77) where the code configured 200; the actual training was truncated to
    52-136 by the stopping rule (B76). R1 executes the configured budget.
  sni: >-
    A protocol change, and stated as one. SNI's ESM explicitly describes early
    stopping. The rule is removed because its stopping signal is a noisy
    per-batch training loss and its epoch cap is bound to the annealing horizon;
    all neural methods now train for the configured number of epochs.
