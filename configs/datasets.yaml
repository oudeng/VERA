schema_version: 1
_comment: |-
  SINGLE SOURCE OF TRUTH for dataset structure (engineering principle E1).
  In R0 this file existed but drove nothing: its only consumer was
  scripts/12_revision_B_tasks.py:66, and its recommended_cat_balance_mode was
  flattened to 'none' in every manifest (P0 finding B24). In code_SNI the
  experiment runners read this file and manifests are GENERATED from it.

  'role' values:
    imputable  - masked and evaluated
    identifier - never masked, excluded from imputation and evaluation
  Column 'issues' record P0 findings verbatim. They are ANNOTATIONS ONLY at this
  stage: P1 does not change any column's role. Resolution is a first-author
  decision informed by the T1.6 quantification (see docs/corrections_R0.md).
seeds:
  train:
  - 1
  - 2
  - 3
  - 5
  - 8
  missingness_generator: 2025
missingness:
  mechanisms:
  - MCAR
  - MAR
  - MNAR
  rates:
  - 0.1
  - 0.3
  - 0.5
  rate_tag_map:
    0.1: 10per
    0.3: 30per
    0.5: 50per
